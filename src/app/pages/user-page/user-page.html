<h1>Usuarios</h1>
<button type="button" class="btn btn-primary mb-3" (click)="openAddModal()">Añadir usuario</button>

<div class="row">
    @for(user of userList(); track user.id) {
    <div class="col-md-3 mb-3">
        <app-user-item-component [user]="user" (editClicked)="openEditModal($event)"
            (deleteClicked)="openDeleteModal($event)"></app-user-item-component>
    </div>
    }
</div>
