<section class="card">
    <div class="card-body">
        <h4 class="card-title">{{meetup()?.title}}</h4>
        <p class="card-text mb-1">Spot: {{meetup()?.spotName}}</p>
        <p class="card-text mb-1">Fecha: {{meetup()?.dateTime}}</p>
        <p class="card-text mb-1">Participantes: {{meetup()?.currentParticipants}}</p>
        <p class="card-text mb-1">Máx.: {{meetup()?.maxParticipants}}</p>
        <p class="card-text mb-1">Nivel mínimo: {{meetup()?.minLevel}}</p>
        <p class="card-text mb-1">Estado: {{meetup()?.status}}</p>
        <p class="card-text mb-1">Organizador: {{meetup()?.organizer}}</p>
        <button type="button" class="btn btn-sm btn-primary mt-2 me-2" (click)="emitEditClicked()">Editar</button>
        <button type="button" class="btn btn-sm btn-danger mt-2" (click)="emitDeleteClicked()">Eliminar</button>
    </div>
</section>
