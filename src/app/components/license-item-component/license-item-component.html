<section class="card">
    <div class="card-body">
        <h4 class="card-title">{{license()?.number}}</h4>
        <p class="card-text mb-1">Usuario: {{license()?.userId}}</p>
        <p class="card-text mb-1">Tipo: {{license()?.type}}</p>
        <p class="card-text mb-1">Comunidad: {{license()?.region}}</p>
        <p class="card-text mb-1">Expedición: {{license()?.issueDate}}</p>
        <p class="card-text mb-1">Caducidad: {{license()?.expirationDate}}</p>
        <p class="card-text mb-1">Válida: {{license()?.valid ? 'Sí' : 'No'}}</p>
        <button type="button" class="btn btn-sm btn-primary mt-2 me-2" (click)="emitEditClicked()">Editar</button>
        <button type="button" class="btn btn-sm btn-danger mt-2" (click)="emitDeleteClicked()">Eliminar</button>
    </div>
</section>
