<section class="card">
    <div class="card-body">
        <h4 class="card-title">{{ad()?.title}}</h4>
        <p class="card-text mb-1">Categoría: {{ad()?.category}}</p>
        <p class="card-text mb-1">Precio (€): {{ad()?.price}}</p>
        <p class="card-text mb-1">Estado: {{ad()?.condition}}</p>
        <p class="card-text mb-1">Ciudad: {{ad()?.city}}</p>
        <p class="card-text mb-1">Anuncio: {{ad()?.status}}</p>
        <button type="button" class="btn btn-sm btn-primary mt-2 me-2" (click)="emitEditClicked()">Editar</button>
        <button type="button" class="btn btn-sm btn-danger mt-2" (click)="emitDeleteClicked()">Eliminar</button>
    </div>
</section>
