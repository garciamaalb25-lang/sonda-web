<div class="modal-header">
    <h4 class="modal-title">@if(forecast) { Editar previsión } @else { Nuevo previsión }</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<form [formGroup]="forecastForm">
    <div class="modal-body">
        <div class="mb-3">
            <label for="forecast-zoneId" class="form-label">ID de zona</label>
            <input type="number" class="form-control" id="forecast-zoneId" formControlName="zoneId">
        </div>
        <div class="mb-3">
            <label for="forecast-zoneName" class="form-label">Zona</label>
            <input type="text" class="form-control" id="forecast-zoneName" formControlName="zoneName">
        </div>
        <div class="mb-3">
            <label for="forecast-date" class="form-label">Fecha</label>
            <input type="date" class="form-control" id="forecast-date" formControlName="date">
        </div>
        <div class="mb-3">
            <label for="forecast-visibility" class="form-label">Visibilidad (m)</label>
            <input type="number" class="form-control" id="forecast-visibility" formControlName="visibility">
        </div>
        <div class="mb-3">
            <label for="forecast-visibilityLevel" class="form-label">Nivel de visibilidad</label>
            <select id="forecast-visibilityLevel" class="form-select" formControlName="visibilityLevel">
                <option value="" selected>-Selecciona uno-</option>
                <option value="MALA">MALA</option>
                <option value="REGULAR">REGULAR</option>
                <option value="BUENA">BUENA</option>
                <option value="EXCELENTE">EXCELENTE</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="forecast-windSpeed" class="form-label">Viento (km/h)</label>
            <input type="number" class="form-control" id="forecast-windSpeed" formControlName="windSpeed">
        </div>
        <div class="mb-3">
            <label for="forecast-windDirection" class="form-label">Dirección del viento</label>
            <select id="forecast-windDirection" class="form-select" formControlName="windDirection">
                <option value="" selected>-Selecciona uno-</option>
                <option value="LEVANTE">LEVANTE</option>
                <option value="PONIENTE">PONIENTE</option>
                <option value="NORTE">NORTE</option>
                <option value="SUR">SUR</option>
            </select>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="forecast-suitable" formControlName="suitable">
            <label class="form-check-label" for="forecast-suitable">Apta para bucear</label>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="formSubmit()">Guardar</button>
    </div>
</form>
