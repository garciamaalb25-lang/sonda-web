<div class="modal-header">
    <h4 class="modal-title">@if(user) { Editar usuario } @else { Nuevo usuario }</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<form [formGroup]="userForm">
    <div class="modal-body">
        <div class="mb-3">
            <label for="user-username" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="user-username" formControlName="username">
        </div>
        <div class="mb-3">
            <label for="user-email" class="form-label">Email</label>
            <input type="email" class="form-control" id="user-email" formControlName="email">
        </div>
        <div class="mb-3">
            <label for="user-experienceLevel" class="form-label">Nivel</label>
            <select id="user-experienceLevel" class="form-select" formControlName="experienceLevel">
                <option value="" selected>-Selecciona uno-</option>
                <option value="PRINCIPIANTE">PRINCIPIANTE</option>
                <option value="INTERMEDIO">INTERMEDIO</option>
                <option value="AVANZADO">AVANZADO</option>
                <option value="EXPERTO">EXPERTO</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="user-role" class="form-label">Rol</label>
            <select id="user-role" class="form-select" formControlName="role">
                <option value="" selected>-Selecciona uno-</option>
                <option value="USER">USER</option>
                <option value="ADMIN">ADMIN</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="user-status" class="form-label">Estado</label>
            <select id="user-status" class="form-select" formControlName="status">
                <option value="" selected>-Selecciona uno-</option>
                <option value="ACTIVO">ACTIVO</option>
                <option value="BLOQUEADO">BLOQUEADO</option>
            </select>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="formSubmit()">Guardar</button>
    </div>
</form>
